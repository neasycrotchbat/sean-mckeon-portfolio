  <div id="app" class="shell">

      </div>
    </header>

    <main id="viewRoot"></main>

    <div id="invertLayer" class="invert-layer"></div>
    <canvas id="gridCanvas" class="grid-canvas"></canvas>

    <div id="transition" class="transition" hidden>
      <div class="transition-dim"></div>
      <div class="transition-wipe"></div>

  <!-- ============ Home ============ -->
  <template id="tpl-home">
    <section class="view view-home" data-view="home">
      <div class="home-col1">
        <h1 class="display-1">Motion<br>Designer</h1>

        <a href="#" class="home-reel" data-reel>Reel 2026</a>
        <div class="home-label">Selected Work</div>
        <div class="home-titles" data-titles></div>
      </div>

      <div class="home-footer" data-footer>
        <div class="footer-blocks">
          <div class="footer-contact"><div class="lbl">Contact</div><a href="mailto:seanrobertmckeon@gmail.com" class="fw">seanrobertmckeon@gmail.com</a></div>
          <div><div class="lbl">Location</div><div class="fw">Richardson, TX</div></div>
        </div>
        <div></div>
        <div class="footer-right">© 2026</div>

  <!-- ============ Project row ============ -->
  <template id="tpl-project">
    <section class="view view-project" data-view="project">
      <div class="spacer64"></div>
      <div class="proj-center">
        <h1 class="proj-title" data-title></h1>
        <div class="strip-wrap">
          <div>
            <div class="strip-track" data-track></div>
          </div>
        </div>
      </div>
      <div class="proj-info" data-info>
        <p class="proj-desc" data-desc></p>
        <div><div class="lbl">Year</div><div class="fw" data-year></div></div>
        <div><div class="lbl">Role</div><div class="fw" data-role></div></div>
        <div><div class="lbl">Visit</div><a class="fw" data-url target="_blank" rel="noreferrer">Watch on Vimeo ↗</a></div>
        <a href="#" class="proj-next" data-next>
          <div class="proj-next-text"><div class="lbl">Next project</div><div class="fw" data-next-title></div></div>
          <div class="proj-next-thumb"><img data-next-poster alt=""></div>

  <!-- ============ Archive ============ -->

    <section class="view view-mosaic" data-view="mosaic">

        <div class="mosaic-grid" data-grid></div>
      </div>
      <div class="mosaic-bar">
        <p class="mosaic-copy">Everything else — reels, cinema spots, bumpers, headshots and projection work, 2012 – 2024.</p>
        <a href="#" class="mosaic-link" data-nav="info">Info &amp; contact <span>→</span></a>
      </div>
    </section>
  </template>

            <div class="xp-row"><span class="fw">S Group Creations <span class="xp-role">Senior Motion Designer</span></span><span class="xp-years">2014 — 16</span></div>
            <div class="xp-row"><span class="fw">T2 / Hint <span class="xp-role">Motion Designer &amp; Programmer</span></span><span class="xp-years">2011 — 14</span></div>

        </div>
      </div>
      <div class="info-footer">
        <div class="footer-blocks">
          <div><div class="lbl">Contact</div><a href="mailto:seanrobertmckeon@gmail.com" class="fw">seanrobertmckeon@gmail.com</a></div>
          <div><div class="lbl">Elsewhere</div><div class="info-links fw"><a href="https://vimeo.com/seanmckeon" target="_blank" rel="noreferrer">Vimeo</a><a href="https://www.linkedin.com/in/sean-mckeon-77018557" target="_blank" rel="noreferrer">LinkedIn</a><a href="uploads/SeanMcKeon_CV_2026.pdf" target="_blank" rel="noreferrer">Resume</a></div></div>
